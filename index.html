<style>

<body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PIN_STEPS=['Switch to a Pinterest business account and claim your website','Write a keyword-rich profile name and bio (what you sell + who it helps)','Create 5–8 boards named for the searches your buyers type','Add 10–15 pins per board before promoting it','Design pins at 2:3 (1000×1500) with a clear headline and brand colours','Write pin titles and descriptions with 2–3 natural keywords','Pin consistently: aim for 3–5 fresh pins per week at the start','Link every pin to your product listing or shop page','Enable Rich Pins and add a Pinterest save button to your site','Make short video pins of process, before/after, or tips','Check Pinterest Analytics monthly and double down on top pins','Refresh best performers with new images every 2–3 months'];
const SL={Planning:'Idea','In progress':'Creating',Review:'Listing',Done:'Live'};
const FEES=p=>{const pl=p&&p.platform&&(S.platforms||[]).find(x=>x.id===p.platform);if(pl)return{fee:num(pl.fee)/100,proc:num(pl.proc)/100,fx:num(pl.fixed),po:num(S.payout)/100};const c=S.calc,g=(k,d)=>c[k]===undefined||c[k]===''?d:num(c[k]);return{fee:g('fee',10)/100,proc:g('proc',2.9)/100,fx:g('fixed',0.8),po:num(S.payout)/100}};
const sb=s=>{if(!s.cur)return s.amt;const c=(S.curs||[]).find(x=>x.id===s.cur);return s.amt*((c&&num(c.rate))||1)};
const fmtS=s=>{if(!s.cur)return money(s.amt);const c=(S.curs||[]).find(x=>x.id===s.cur);return s.amt.toFixed(2)+' '+(c&&c.code?c.code:'?')};
const saleFees=s=>{const p=S.projects.find(x=>x.id===s.pid),F=FEES(p);const gr=sb(s)*(F.fee+F.proc)+F.fx*s.units;return gr+(sb(s)-gr)*F.po};
const ymOf=s=>new Date(s.at).toLocaleDateString('en-CA').slice(0,7);
const fSales=()=>[...S.sales].sort((a,b)=>b.at-a.at).filter(s=>(!D.fm||ymOf(s)===D.fm)&&(!D.fp||(D.fp==='_shop'?!s.pid:s.pid===D.fp)));
const psum=p=>{const F=FEES(p),ss=S.sales.filter(s=>s.pid===p.id),u=ss.reduce((a,s)=>a+s.units,0),r=ss.reduce((a,s)=>a+sb(s),0),net=(r*(1-F.fee-F.proc)-F.fx*u)*(1-F.po),cost=num(p.cost);return{u,r,net,cost,profit:net-cost}};
const COLORS=['#FFE9A8','#C9EBD8','#CFE3FA','#F9D0D9','#E5D7F7'];
const DEF={projects:[],ideas:[],files:[],calc:{},pin:{checks:{},pins:[],kw:''}};
let S=JSON.parse(JSON.stringify(DEF)),tab='home',pid=null,db=null,assets=null,ref=null,loaded=false,saveT,dirty=false,lastK=null,armed=null,D={},legacy=[],salesLoaded=false,lastMonths={};
const $=id=>document.getElementById(id);
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#0A2E22;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-weight:600;max-width:90%';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>{t.style.display='none'},3500)}
window.alert=toast;

const LS='creator-studio-data',APP_VERSION='1.0.0';let deferredPrompt=null,swReg=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('creator-studio-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbPut=async(k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
const idbGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const idbDel=async k=>{const d=await idb();return new Promise(res=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=()=>res();t.onerror=()=>res()})};
function saveFile(name,data,mime){const b=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function init(){
  try{
    const u=null;
    if(u){db=u;ref=db.doc('app/state');
      const idle=()=>!/INPUT|TEXTAREA|SELECT/.test((document.activeElement&&document.activeElement.tagName)||'');
      const mig=()=>{if(legacy.length&&salesLoaded&&loaded)save()};
      ref.onSnapshot(sn=>{if(dirty&&loaded)return;const d=sn.exists?sn.data():null;const k=JSON.stringify(d);if(loaded&&k===lastK)return;lastK=k;loaded=true;
        if(d){const keep=S.sales||[],nd=JSON.parse(k);S=Object.assign(JSON.parse(JSON.stringify(DEF)),nd);
          if(Array.isArray(nd.sales)&&nd.sales.length){legacy=nd.sales.slice();S.sales=(!salesLoaded||!keep.length)?nd.sales.slice():keep}else S.sales=keep}
        if(idle())render();mig()});
      db.collection('sales').onSnapshot(sn=>{if(dirty&&salesLoaded)return;const items=[],m={};
        sn.docs.forEach(x=>{const dd=x.data()||{},a=Array.isArray(dd.items)?dd.items:[];m[x.id]=JSON.stringify(a);a.forEach(i=>items.push(i))});
        if(salesLoaded&&JSON.stringify(m)===JSON.stringify(lastMonths))return;
        lastMonths=m;salesLoaded=true;
        if(!(items.length===0&&legacy.length))S.sales=JSON.parse(JSON.stringify(items));
        if(idle())render();mig()},()=>{});
    }
  }catch(e){}
  if(!db){try{const v=localStorage.getItem(LS);if(v)S=Object.assign(S,JSON.parse(v))}catch(e){}}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();
}
let svTries=0;
function save(){dirty=true;clearTimeout(saveT);saveT=setTimeout(doSave,400)}
async function doSave(){
  if(ref&&!(loaded&&salesLoaded)){if(++svTries===10)toast('Still connecting to storage. Your changes will save once it is ready.');saveT=setTimeout(doSave,500);return}
  svTries=0;
  try{
  const d=JSON.parse(JSON.stringify(S));
  if(ref){
    const sales=d.sales||[];delete d.sales;
    const mm={};sales.forEach(x=>{const k=ymOf(x);(mm[k]=mm[k]||[]).push(x)});
    const now={};Object.keys(mm).forEach(k=>{now[k]=JSON.stringify(mm[k])});
    for(const k of Object.keys(now)){if(lastMonths[k]!==now[k])await db.doc('sales/'+k).set({items:mm[k]})}
    for(const k of Object.keys(lastMonths)){if(!(k in now))await db.doc('sales/'+k).delete()}
    lastMonths=now;legacy=[];
    await ref.set(d);lastK=JSON.stringify(d);
  }else localStorage.setItem(LS,JSON.stringify(d));
}catch(e){console.error(e);alert('Could not save: '+(e.message||e.code||'error'))}dirty=false}
const P=()=>S.projects.find(p=>p.id===pid);
const pct=p=>p.tasks.length?Math.round(p.tasks.filter(t=>t.done).length*100/p.tasks.length):0;
const num=v=>parseFloat(v)||0;
const money=n=>((S.quote&&S.quote.cur)||'$')+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const TABS=[['home','Dashboard'],['dash','Products'],['files','Files'],['brain','Ideas'],['calc','Pricing Calculator'],['pin','Pinterest Plan'],['sales','Sales'],['set','Settings']];

function vCal(){

document.addEventListener('click',async e=>{

  else if(a==='cancelsale'){D.es=null}
  else if(a==='delsale'){S.sales=S.sales.filter(x=>x.id!==v);save()}
  else if(a==='addwk'){const n=(($('wi')||{}).value||'').trim();if(!n)return;S.weekly.items.push({id:uid(),t:n,done:false});D.wi='';save()}
  else if(a==='delwk'){S.weekly.items=S.weekly.items.filter(x=>x.id!==v);save()}
  else if(a==='print'){window.print();return}
  render();
  }catch(err){alert('Error: '+(err&&err.message||err))}
});
document.addEventListener('change',async e=>{
  const t=e.target,a=t.dataset.a,v=t.dataset.v;
  if(t.id==='up'){return upload(t.files)}
  if(t.id==='rs'){return restore(t.files[0])}
  if(!a)return;
  if(a==='pick'){pid=t.value}
  else if(a==='status'){P().status=t.value;save()}
  else if(a==='due'){P().due=t.value;save()}
  else if(a==='tick'){P().tasks[+v].done=t.checked;save()}
  else if(a==='toTask'&&t.value){S.projects.find(p=>p.id===t.value).tasks.push({t:S.ideas.find(i=>i.id===v).text,done:false});save();alert('Added as a task.')}
  else if(a==='pchk'){S.pin.checks[v]=t.checked;save()}
  else if(a==='pdone'){S.pin.pins.find(p=>p.id===v).done=t.checked;save()}
  else if(a==='qstat'){const q=S.projects.find(x=>x.id===v).quote,b=recv(q);q.status=t.value;const dl=recv(q)-b;if(dl){(q.pay=q.pay||[]).push({at:Date.now(),amt:dl})}save()}
  else if(a==='sfm'){D.fm=t.value}
  else if(a==='sfp'){D.fp=t.value}
  else if(a==='pplat'){P().platform=t.value;save()}
  else if(a==='calcplat'){const x=S.platforms.find(y=>y.id===t.value);if(x){S.calc.fee=x.fee;S.calc.proc=x.proc;S.calc.fixed=x.fixed;save()}}
  else if(a==='pcost'){P().cost=t.value;save()}
  else if(a==='pprice'){P().price=t.value;save()}
  else if(a==='goal'){S.goal=t.value;save()}
  else if(a==='wk'){S.weekly.items.find(x=>x.id===v).done=t.checked;save()}
  else if(a==='q'){S.quote[v]=t.value;save();if(v==='cur')render();return}
  else if(a==='calc'){S.calc[v]=t.value;save()}
  else if(a==='kw'){S.pin.kw=t.value;save();return}
  else if(a==='pnotes'){P().notes=t.value;save();return}
  render();
});
document.addEventListener('input',e=>{const t=e.target;if(t.id)D[t.id]=t.value;if(t.dataset.a==='set'){S[t.dataset.v]=t.value;save();return}if(t.dataset.a==='plf'){const pv=t.dataset.v.split('|'),x=S.platforms.find(y=>y.id===pv[0]);if(x){x[pv[1]]=t.value;save()}return}if(t.dataset.a==='cuf'){const cv=t.dataset.v.split('|'),c=(S.curs||[]).find(y=>y.id===cv[0]);if(c){c[cv[1]]=cv[1]==='code'?t.value.toUpperCase():t.value;save()}return}if(t.dataset.a==='q'&&t.dataset.v==='cur'){S.quote.cur=t.value;save();const p=t.selectionStart;render();const n=document.querySelector('[data-v="cur"]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}return}if(t.dataset.a==='calc'){S.calc[t.dataset.v]=t.value;save();const p=t.selectionStart,k=t.dataset.v;render();const n=document.querySelector(`[data-v="${k}"]`);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}}});

document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.shiftKey)return;const m={nt:'addtask',wi:'addwk',pn:'addproj',pc:'addproj',pt:'addpin',pb:'addpin'}[e.target.id];if(m){e.preventDefault();document.querySelector(`[data-a="${m}"]`).click()}});
async function exportSales(list){const L=(list||[...S.sales]).slice().sort((a,b)=>a.at-b.at),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',rows=[['Date','Product','Platform','Units','Amount','Currency','Amount in main currency','Est. fees','Est. net']];L.forEach(s=>{const p=S.projects.find(x=>x.id===s.pid),pl=p&&p.platform?((S.platforms.find(x=>x.id===p.platform)||{}).name||''):'',c=s.cur&&(S.curs||[]).find(x=>x.id===s.cur),base=sb(s),fees=saleFees(s);rows.push([new Date(s.at).toLocaleDateString('en-CA'),p?p.name:'Whole shop',pl,s.units,s.amt.toFixed(2),c?c.code:'',base.toFixed(2),fees.toFixed(2),(base-fees).toFixed(2)])});const csv=rows.map(r=>r.map(q).join(',')).join('\n'),name='sales-'+new Date().toLocaleDateString('en-CA')+'.csv';try{saveFile(name,'\ufeff'+csv,'text/csv;charset=utf-8');toast('Sales exported')}catch(e){toast('Could not export')}}
async function backup(){const json=JSON.stringify(S,null,2),name='creator-studio-backup-'+new Date().toLocaleDateString('en-CA')+'.json';try{saveFile(name,json,'application/json');toast('Backup saved')}catch(e){toast('Could not create a backup')}}
async function restore(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.projects))throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEF)),d);save();render();toast('Backup restored')}catch(e){toast('That file is not a valid backup')}}
async function upload(list){
  for(const file of list){
    try{
      const fid=uid();await idbPut(fid,file);
      const old=S.files.find(f=>f.pid===pid&&f.name===file.name&&f.folder==='current');
      let ver=1;if(old){old.folder='archive';ver=old.ver+1}
      S.files.push({id:fid,pid,name:file.name,url:'',assetId:fid,size:file.size,ver,folder:'current',at:Date.now()});
    }catch(err){alert('Could not store '+file.name+': '+(err.message||'storage error'))}
  }
  save();render();
}
init();
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(r=>{swReg=r;r.addEventListener('updatefound',()=>{const n=r.installing;if(n)n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)toast('Update ready. Reload the app to use it.')})})}).catch(()=>{})});
</script>
